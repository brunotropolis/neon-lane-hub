name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MODO EM CONSTRUÇÃO: publica a página estática em maintenance/ (não builda o React).
      # Para restaurar o site completo, reverter este workflow para a versão com npm build
      # (o código React continua intacto no repo; tag de backup: site-v1-backup).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maintenance

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
